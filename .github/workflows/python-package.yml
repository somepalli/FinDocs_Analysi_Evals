name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Sync locked project and development dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev
      - name: Lint with Ruff
        run: uv run --frozen --no-sync python -m ruff check .
      - name: Test with pytest
        run: uv run --frozen --no-sync python -m pytest -p no:cacheprovider

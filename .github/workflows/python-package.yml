name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Sync locked project and development dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev
      - name: Lint with Ruff
        run: uv run --frozen --no-sync python -m ruff check .
      - name: Validate corpus-backed evaluation datasets
        run: >-
          uv run --frozen --no-sync python scripts/validate_dataset.py
          --dataset evals/datasets/phase4_corpus.jsonl
          --dataset evals/datasets/phase6_cross_lingual.jsonl
          --corpus-manifest evals/datasets/phase1_benchmark_chunk_manifest.json
      - name: Test with pytest
        run: uv run --frozen --no-sync python -m pytest -p no:cacheprovider

name: Pylint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Sync locked project and development dependencies
        run: uv sync --frozen --python 3.11 --extra dev
      - name: Analyze errors with Pylint
        run: >-
          uv run --frozen --no-sync python -m pylint --errors-only --disable=import-error
          src/findociq evals scripts
